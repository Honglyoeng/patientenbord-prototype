<style>
/* Layout: one illustrated room scene, scaled to fit the screen. Containers open a tray of magnets; a chosen magnet flies onto the board. */
:root {
  --wall: #E8F0ED;
  --ink: #4B5670;
  --navy: #1D2B58;
  --shade: #D3DFDA;
  --paper: #FFFFFF;
  --display: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html { height: 100%; background: var(--wall); }
body {
  margin: 0;
  box-sizing: border-box;
  background: var(--wall);
  color: var(--navy);
  height: 100vh; height: 100dvh;
  padding: 0;
  touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  overflow: hidden;
  font-family: var(--display);
}
#scene { display: block; flex: 1 1 0; width: 100%; height: auto; overflow: visible; min-width: 0; min-height: 0; user-select: none; -webkit-user-select: none; }
#scene * { -webkit-tap-highlight-color: transparent; }

/* containers */
.cont { transition: transform .22s cubic-bezier(.3, 1.5, .5, 1); animation: nudge .7s cubic-bezier(.3, 1.5, .5, 1) var(--d) 1 backwards; }
.cont.hover { transform: translateY(-5px); }
@keyframes nudge { 0% { transform: translateY(0); } 35% { transform: translateY(-14px); } 100% { transform: translateY(0); } }
.hit { fill: #fff; fill-opacity: 0; stroke: transparent; stroke-width: 4; stroke-dasharray: 10 8; cursor: pointer; transition: stroke .2s ease; }
.hit:focus { outline: none; }
.hit:focus-visible { stroke: var(--navy); }

/* small pulsing dot on each container */
.dotcue { pointer-events: none; transition: opacity .2s ease; }
.dotcue.off { opacity: 0; }
.dotcue .core { fill: #8C96A8; stroke: #fff; stroke-width: 2.5; }
.dotcue .ring { fill: none; stroke: #8C96A8; stroke-width: 2; transform-box: fill-box; transform-origin: center; opacity: 0; animation: dring 5s ease-out var(--pd, 0s) infinite; }
@keyframes dring { 0% { transform: scale(1); opacity: .6; } 32% { transform: scale(2.3); opacity: 0; } 100% { transform: scale(2.3); opacity: 0; } }

/* on hover the stack of magnets rises so its label shows */
.stack { transition: transform .3s cubic-bezier(.3, 1.6, .5, 1); }
.cont.hover .stack { transform: translateY(-16px); }

/* fields on the board that the marker can fill in */
.fld { fill: #1D2B58; fill-opacity: 0; stroke: transparent; stroke-width: 3; stroke-dasharray: 9 7; cursor: pointer; transition: fill-opacity .15s ease; }
.fld:hover { fill-opacity: .07; }
.fld:focus { outline: none; }
.fld:focus-visible { stroke: var(--navy); fill-opacity: .07; }
.ink { transition: opacity .3s ease; }
.hint { opacity: 0; transition: opacity .35s ease; pointer-events: none; }
.hint.show { opacity: 1; }
.hint text { font-family: var(--display); font-weight: 800; letter-spacing: .06em; fill: #8C96A8; }
.mkhit { fill: #fff; fill-opacity: 0; stroke: transparent; stroke-width: 3; stroke-dasharray: 9 7; cursor: pointer; }
.mkhit:focus { outline: none; }
.mkhit:focus-visible { stroke: var(--navy); }
#ink text { font-family: "Caveat", "Segoe Print", "Bradley Hand", cursive; font-weight: 600; fill: #2E4DB0; }

/* magnets resting in a container */
.sn { transform-origin: 0 0; pointer-events: none; transition: transform .55s cubic-bezier(.3, .9, .3, 1), opacity .25s ease var(--od, 0ms); }

/* magnets that travel (showcase below the containers, and on the board) */
.fm { cursor: pointer; }
.fm:focus { outline: none; }
.fm .body { transition: transform .16s ease; }
.fm.tray:hover .body, .fm.tray:focus-visible .body { transform: translateY(-6px); }
.fm.board:hover .body, .fm.board:focus-visible .body { transform: translateY(-3px); }
.fm .focus { opacity: 0; }
.fm:focus-visible .focus { opacity: 1; }

/* NL / EN switch on the table */
.langsw { position: relative; display: inline-flex; padding: 4px; background: #fff; border-radius: 999px; box-shadow: 0 2px 10px rgba(29, 43, 88, .18); }
.langsw .hl { position: absolute; left: 4px; top: 4px; width: 50px; height: 30px; border-radius: 999px; background: var(--navy); box-shadow: 0 0 0 2px rgba(29, 43, 88, .22); transform: translateX(50px); transition: transform .28s cubic-bezier(.3, 1.3, .5, 1); }
.langsw.en .hl { transform: none; }
.langsw .seg { position: relative; width: 50px; height: 30px; padding: 0; border: 0; background: transparent; border-radius: 999px; cursor: pointer; font-family: var(--display); font-size: 13px; font-weight: 800; color: var(--navy); transition: color .2s ease; }
.langsw .seg[aria-pressed="true"] { color: #fff; }
.langsw .seg:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
#top .langsw { grid-column: 2; grid-row: 3; justify-self: end; align-self: end; }

/* the board eraser on the table clears the board */
.eraser { cursor: pointer; transition: transform .2s cubic-bezier(.3, 1.5, .5, 1), opacity .25s ease; }
.eraser:hover { transform: translateY(-5px); }
.eraser.off { opacity: .55; cursor: default; }
.eraser.off:hover { transform: none; }
.eraser.busy { pointer-events: none; }
.eraser:focus { outline: none; }
.eraser .focus { opacity: 0; }
.eraser .ertip { font-family: var(--display); font-weight: 800; letter-spacing: .06em; fill: #8C96A8; opacity: 0; transition: opacity .2s ease; pointer-events: none; }
.eraser:hover .ertip, .eraser:focus-visible .ertip { opacity: 1; }
.eraser:focus-visible .focus { opacity: 1; }
.eraser.wipe { animation: wipe .55s ease; }
@keyframes wipe { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-12px); } 45% { transform: translateX(9px); } 70% { transform: translateX(-5px); } }

/* controls */
#reset {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  right: max(16px, env(safe-area-inset-right, 0px));
  font: 800 13px/1 var(--display);
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--navy);
  background: var(--paper);
  border: 3px solid var(--ink);
  border-radius: 12px;
  padding: 11px 14px;
  box-shadow: 4px 5px 0 var(--shade);
  cursor: pointer;
}

/* page header */
#top {
  position: relative; z-index: 3;
  flex: none; box-sizing: border-box; width: 100%; max-width: 1040px; margin: 0 auto;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 20px; row-gap: 0; align-items: center;
  padding: max(14px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 28px max(16px, env(safe-area-inset-left, 0px));
}
#top .txt { display: contents; }
#top .eyebrow { grid-column: 1; grid-row: 1; }
#top h1 { grid-column: 1; grid-row: 2; }
#top .about { grid-column: 2; grid-row: 1 / span 2; }
#top .steps { grid-column: 1; grid-row: 3; }
.eyebrow { margin: 0 0 2px; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #6B7894; }
#top h1 { margin: 0; font-size: clamp(22px, 3.4vw, 32px); line-height: 1.1; font-weight: 800; letter-spacing: -.005em; color: var(--navy); text-wrap: balance; }
.steps { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 18px; counter-reset: s; font-size: 13px; line-height: 1.35; font-weight: 500; color: var(--ink); }
.steps li { counter-increment: s; display: flex; align-items: baseline; gap: 7px; min-width: 0; }
.steps li::before { content: counter(s); flex: none; width: 19px; height: 19px; border-radius: 50%; background: var(--navy); color: #fff; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; transform: translateY(-1px); }
.about {
  flex: none; display: inline-flex; align-items: center; gap: 10px; cursor: pointer;
  font-family: var(--display); font-size: 15px; font-weight: 800; color: #fff; background: #1D2B58;
  border: 0; border-radius: 999px; padding: 9px 20px 9px 10px; transition: background .15s ease, transform .15s ease;
}
.about:hover { background: #141F44; transform: translateY(-1px); }
.about:focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; }
.about .q { width: 26px; height: 26px; border-radius: 50%; background: #F0EE9E; color: #1D2B58; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; }

/* about dialog */
.modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(21, 29, 62, .58); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); animation: mfade .2s ease; }
.modal[hidden] { display: none !important; }
@keyframes mfade { from { opacity: 0; } to { opacity: 1; } }
@keyframes mrise { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
.card { width: 100%; max-width: 640px; max-height: min(92vh, 760px); max-height: min(92dvh, 760px); display: flex; flex-direction: column; background: #FFFBF3; border-radius: 22px; overflow: hidden; box-shadow: 0 24px 60px rgba(10, 16, 44, .45); animation: mrise .28s cubic-bezier(.2, .9, .3, 1); }
.card header { flex: none; background: #1D2B58; color: #fff; padding: 20px 24px 18px; }
.card header .eyebrow { color: #F0EE9E; display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.card header .eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #F0EE9E; }
.card h2 { margin: 0; font-size: clamp(21px, 5vw, 27px); line-height: 1.1; font-weight: 800; text-transform: uppercase; letter-spacing: .005em; }
.card .body { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 18px 24px 8px; color: var(--ink); }
.card h3 { margin: 18px 0 8px; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #C23A33; }
.card h3:first-child { margin-top: 2px; }
.card .lead { margin: 0; font-size: 17px; line-height: 1.45; font-weight: 600; color: #1D2B58; }
.card ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.card li { position: relative; padding-left: 18px; font-size: 14.5px; line-height: 1.45; font-weight: 500; }
.card li::before { content: ""; position: absolute; left: 2px; top: .55em; width: 7px; height: 7px; border-radius: 50%; background: #1D2B58; }
.card .ic { flex: none; width: 36px; height: 36px; border-radius: 50%; background: #F0EE9E; color: var(--navy); display: inline-flex; align-items: center; justify-content: center; }
.card .ic svg { width: 19px; height: 19px; }
.card .items { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.card .items.one { grid-template-columns: 1fr; }
.card .items.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.card .items.three .item { flex-direction: column; align-items: flex-start; gap: 8px; }
.card .items > .item:last-child:nth-child(odd):not(.three *) { grid-column: 1 / -1; }
.card .item { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid #E8E1D2; border-radius: 14px; padding: 11px 13px; min-width: 0; }
.card .item div { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.card .item b, .card .callout b { font-size: 14px; line-height: 1.25; font-weight: 800; color: var(--navy); }
.card .item span:not(.ic), .card .callout span:not(.ic) { font-size: 12.5px; line-height: 1.4; font-weight: 500; color: var(--ink); }
.card .flow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; counter-reset: f; }
.card .stp { position: relative; counter-increment: f; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; background: #fff; border: 1px solid #E8E1D2; border-radius: 14px; padding: 14px 8px 12px; }
.card .stp b { font-size: 12.5px; line-height: 1.3; font-weight: 800; color: var(--navy); }
.card .stp::before { content: counter(f); position: absolute; top: -9px; left: -9px; width: 22px; height: 22px; border-radius: 50%; background: var(--navy); color: #fff; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.card .stp + .stp::after { content: ""; position: absolute; left: -17px; top: 50%; width: 10px; height: 10px; border-top: 3px solid #C23A33; border-right: 3px solid #C23A33; transform: translateY(-50%) rotate(45deg) scale(.7); border-radius: 1px; }
.card .callout { display: flex; gap: 12px; align-items: flex-start; margin-top: 10px; background: #FBEBE8; border-radius: 14px; padding: 12px 14px; }
.card .callout .ic { background: #fff; color: #C23A33; }
.card .callout div { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.card .quote { margin: 10px 0 0; background: var(--navy); color: #fff; border-radius: 14px; padding: 14px 16px; }
.card .quote p { margin: 0 0 6px; font-size: 15px; line-height: 1.4; font-weight: 600; font-style: italic; }
.card .quote cite { font-size: 12px; font-style: normal; font-weight: 500; color: #F0EE9E; }
.card .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.card .stat { background: #EEF3F1; border-radius: 12px; padding: 10px 10px 11px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.card .stat b { font-size: 24px; line-height: 1; font-weight: 800; color: var(--navy); }
.card .stat span { font-size: 12px; line-height: 1.35; font-weight: 500; color: var(--ink); }
.card .note { margin: 8px 0 0; font-size: 11.5px; line-height: 1.4; color: #6B7894; }
.card li b { color: var(--navy); font-weight: 800; }
.card footer { flex: none; display: flex; gap: 12px; padding: 14px 24px max(18px, env(safe-area-inset-bottom, 0px)); border-top: 1px solid #E8E1D2; }
.card footer button { flex: 1 1 0; font-family: var(--display); font-size: 15px; font-weight: 800; padding: 13px 10px; border-radius: 999px; cursor: pointer; border: 2px solid #1D2B58; transition: background .15s ease; }
.card footer .ghost { background: #fff; color: #1D2B58; }
.card footer .ghost:hover { background: #F3F0E6; }
.card footer .solid { background: #1D2B58; color: #fff; }
.card footer .solid:hover { background: #141F44; }
.card footer button:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
@media (max-width: 560px) { .card .items { grid-template-columns: 1fr; } .card .items.three { grid-template-columns: 1fr; } .card .items.three .item { flex-direction: row; align-items: center; } .card .flow { gap: 14px; } .card .stp + .stp::after { left: -12px; width: 8px; height: 8px; } .card .stat span { font-size: 11px; } .card .stat b { font-size: 20px; } #top .steps { grid-column: 1 / -1; } #top .langsw { grid-column: 1 / -1; grid-row: 4; justify-self: start; margin-top: 10px; } .steps { flex-direction: column; gap: 4px; font-size: 12px; } .about { font-size: 13px; padding: 7px 14px 7px 8px; gap: 8px; } .about .q { width: 22px; height: 22px; font-size: 13px; } .card footer button { font-size: 14px; } }
#reset:disabled { opacity: .4; cursor: default; }
#reset:focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

</style>
